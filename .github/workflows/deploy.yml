name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            formulario/package-lock.json
            admin/package-lock.json

      - name: Build formulario
        working-directory: formulario
        env:
          VITE_GAS_URL: ${{ secrets.VITE_GAS_URL }}
        run: |
          npm ci
          npm run build

      - name: Build admin
        working-directory: admin
        env:
          VITE_GAS_URL: ${{ secrets.VITE_GAS_URL }}
        run: |
          npm ci
          npm run build

      - name: Prepare gh-pages output
        run: |
          mkdir -p gh-pages/formulario
          mkdir -p gh-pages/admin
          cp -r formulario/dist/. gh-pages/formulario/
          cp -r admin/dist/. gh-pages/admin/
          touch gh-pages/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          publish_branch: gh-pages
